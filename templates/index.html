<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherLens AI</title>
  <style>
    /* ── reset / base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #4f8ef7;
      --accent-dim:#2d5aad;
      --text:      #e2e5f1;
      --muted:     #7a7f99;
      --alert-bg:  #1e1220;
      --alert-bd:  #7b3f6e;
      --alert-dot: #d966b0;
      --fore-bg:   #0f1e2e;
      --fore-bd:   #2a5a8c;
      --fore-dot:  #5ba8e8;
      --radius:    10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    /* ── header ─────────────────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent); }
    header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── search form ────────────────────────────────────────────────────── */
    .search-card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #query {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #query:focus { border-color: var(--accent); }
    #query::placeholder { color: var(--muted); }

    button[type="submit"] {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 20px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button[type="submit"]:hover { background: var(--accent-dim); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: default; }

    .filters {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .filter-label {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .radio-group {
      display: flex;
      gap: 6px;
    }

    .radio-group label {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      color: var(--muted);
      transition: all 0.15s;
      user-select: none;
    }
    .radio-group input[type="radio"] { display: none; }
    .radio-group input[type="radio"]:checked + label {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .topk-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .topk-group label {
      color: var(--muted);
      font-size: 0.85rem;
    }
    #top-k {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 4px 8px;
      width: 64px;
    }

    /* ── status messages ────────────────────────────────────────────────── */
    #status {
      width: 100%;
      max-width: 680px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 24px;
      margin-bottom: 8px;
    }
    #status.error { color: #e05c6b; }

    /* ── results ────────────────────────────────────────────────────────── */
    #results {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      animation: fadeIn 0.2s ease;
    }
    .result-card.alert-card  { border-left: 3px solid var(--alert-bd); background: var(--alert-bg); }
    .result-card.forecast-card { border-left: 3px solid var(--fore-bd); background: var(--fore-bg); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .badge-alert    { background: rgba(123,63,110,0.35); color: var(--alert-dot); }
    .badge-forecast { background: rgba(42,90,140,0.35); color: var(--fore-dot); }

    .card-event {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .card-location {
      color: var(--muted);
      font-size: 0.82rem;
      margin-left: auto;
    }

    .sim-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sim-bar-track {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .sim-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .sim-label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .card-text {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #c5c9de;
      white-space: pre-wrap;
    }

    /* ── spinner ────────────────────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Weather<span>Lens</span> AI</h1>
    <p>Semantic search over live NWS alerts &amp; forecasts</p>
  </header>

  <div class="search-card">
    <form id="search-form" autocomplete="off">
      <div class="input-row">
        <input id="query" type="text" name="query"
               placeholder="e.g. flash flood risk this weekend" />
        <button type="submit" id="search-btn">Search</button>
      </div>
      <div class="filters">
        <span class="filter-label">Source</span>
        <div class="radio-group">
          <input type="radio" id="src-all"      name="source_type" value=""         checked />
          <label for="src-all">All</label>

          <input type="radio" id="src-alert"    name="source_type" value="alert" />
          <label for="src-alert">Alerts</label>

          <input type="radio" id="src-forecast" name="source_type" value="forecast" />
          <label for="src-forecast">Forecasts</label>
        </div>
        <div class="topk-group">
          <label for="top-k">Results</label>
          <input id="top-k" type="number" min="1" max="20" value="5" />
        </div>
      </div>
    </form>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <script>
    const form      = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const btn       = document.getElementById('search-btn');
    const statusEl  = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    async function searchOne(q, topK, sourceType) {
      const resp = await fetch('/weather/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, top_k: topK, source_type: sourceType }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `Error ${resp.status}`);
      return data.results;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const q = queryInput.value.trim();
      if (!q) { setStatus('Enter a search query.', true); return; }

      const topK = Math.min(20, Math.max(1, parseInt(document.getElementById('top-k').value) || 5));
      const sourceType = document.querySelector('input[name="source_type"]:checked').value;

      setStatus('<span class="spinner"></span>Searching…');
      resultsEl.innerHTML = '';
      btn.disabled = true;

      try {
        let items;

        if (sourceType === '') {
          // "All" — fetch each type separately so both are guaranteed
          // representation; a single unfiltered query is dominated by whichever
          // type has more chunks in the DB (usually forecasts).
          const half = Math.ceil(topK / 2);
          const [alerts, forecasts] = await Promise.all([
            searchOne(q, half, 'alert'),
            searchOne(q, half, 'forecast'),
          ]);
          // Merge-sort by similarity descending, capped at topK.
          items = mergeBySimilarity(alerts, forecasts).slice(0, topK);
        } else {
          items = await searchOne(q, topK, sourceType);
        }

        if (items.length === 0) {
          setStatus('No results found. Try syncing more locations first.');
          return;
        }

        setStatus(`${items.length} result${items.length !== 1 ? 's' : ''} for "${q}"`);
        renderResults(items);

      } catch (err) {
        setStatus(err.message || 'Request failed — is the server running?', true);
      } finally {
        btn.disabled = false;
      }
    });

    function mergeBySimilarity(a, b) {
      const out = [];
      let i = 0, j = 0;
      while (i < a.length && j < b.length) {
        if (a[i].similarity >= b[j].similarity) out.push(a[i++]);
        else out.push(b[j++]);
      }
      while (i < a.length) out.push(a[i++]);
      while (j < b.length) out.push(b[j++]);
      return out;
    }

    function setStatus(html, isError = false) {
      statusEl.innerHTML = html;
      statusEl.className = isError ? 'error' : '';
    }

    function renderResults(items) {
      resultsEl.innerHTML = items.map((r, i) => {
        const isAlert = r.source_type === 'alert';
        const pct = Math.round(r.similarity * 100);
        const barWidth = Math.max(2, pct);
        const text = escHtml(r.chunk_text);
        const loc  = escHtml(r.location);
        const evt  = escHtml(r.event || '—');

        return `
          <div class="result-card ${isAlert ? 'alert-card' : 'forecast-card'}">
            <div class="card-header">
              <span class="badge ${isAlert ? 'badge-alert' : 'badge-forecast'}">
                ${isAlert ? 'Alert' : 'Forecast'}
              </span>
              <span class="card-event">${evt}</span>
              <span class="card-location">${loc}</span>
            </div>
            <div class="sim-bar-row">
              <div class="sim-bar-track">
                <div class="sim-bar-fill" style="width:${barWidth}%"></div>
              </div>
              <span class="sim-label">similarity ${pct}%</span>
            </div>
            <div class="card-text">${text}</div>
          </div>`;
      }).join('');
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>

</body>
</html>
