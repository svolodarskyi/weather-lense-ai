name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    # Prevent concurrent deploys from racing each other
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gate deploy on green tests — same suite as CI
      - name: Run tests
        run: pytest tests/ -v --tb=short

      - uses: databricks/setup-cli@main

      # Deploy bundle resources (app resource + scheduled job)
      - name: Deploy bundle (prod target)
        run: databricks bundle deploy --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Push source code to the app. The prod target sets a fixed root_path
      # (/Workspace/Shared/.bundle/weather-lens-ai/prod) so this path is
      # stable regardless of which user or service principal runs the job.
      - name: Deploy app source code
        run: |
          databricks apps deploy weather-lens-ai \
            --source-code-path /Workspace/Shared/.bundle/weather-lens-ai/prod/files
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
