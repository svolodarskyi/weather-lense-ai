resources:
  jobs:
    refresh_weather_index:
      name: "WeatherLens AI - refresh weather index"

      tasks:
        - task_key: refresh
          # No environment_key / no environment spec:
          # - psycopg2 is already shipped by Databricks Runtime (2.9.11)
          # - sentence-transformers is installed via %pip inside the notebook
          # - dbutils.library.restartPython() gives a clean interpreter after pip
          notebook_task:
            notebook_path: ../notebooks/refresh_weather_index.py
            base_parameters:
              locations: "Chicago, IL;Miami, FL;New York, NY;Los Angeles, CA;Houston, TX"
              limit: "50"
              secret_scope: "database"
              secret_key: "lakebase-url"

      schedule:
        quartz_cron_expression: "0 0,30 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      max_concurrent_runs: 1
      timeout_seconds: 1800
