resources:
  jobs:
    refresh_weather_index:
      name: "WeatherLens AI - refresh weather index"

      tasks:
        - task_key: refresh
          # No environment_key — psycopg2 ships with DBR; sentence-transformers
          # is installed via %pip inside the notebook.
          notebook_task:
            notebook_path: ../notebooks/refresh_weather_index.py
            base_parameters:
              locations: ${var.locations}
              limit: "50"
              secret_scope: ${var.secret_scope}
              secret_key: ${var.secret_key}

      schedule:
        quartz_cron_expression: "0 0,30 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      max_concurrent_runs: 1
      timeout_seconds: 1800

      email_notifications:
        on_failure:
          - sergii.volodarskyi@gmail.com
        no_alert_for_skipped_runs: true
